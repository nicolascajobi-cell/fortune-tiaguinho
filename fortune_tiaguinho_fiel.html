const keys=["T", "\ud83c\udfc6", "\ud83c\udf7a", "\u26bd", "\ud83e\udd4a"];
const initial=['T','🏆','🍺','⚽','T','🥊','🥊','T','⚽'];
let balance=100,busy=false,turbo=false,auto=false,autoTimer=null,timers=[];
const bal=document.getElementById('bal'),win=document.getElementById('win'),msg=document.getElementById('msg');
const fmt=n=>'R$ '+n.toFixed(2).replace('.',',');
function makeReels(vals){
 root.querySelectorAll('.reel').forEach(x=>x.remove());
 vals.forEach((v,i)=>{let d=document.createElement('div');d.className='reel r'+i;d.dataset.symbol=v;let im=document.createElement('img');im.src=imgs[v];im.alt=v==='T'?'Tiaguinho':v;d.appendChild(im);root.appendChild(d);});
}
const rnd=()=>keys[Math.floor(Math.random()*keys.length)];
function finish(){
 timers.forEach(clearInterval);timers=[];
 let vals=Array.from({length:9},rnd);makeReels(vals);
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,4,8],[2,4,6]];
 let prize=0,hits=[];
 lines.forEach(line=>{let a=vals[line[0]],b=vals[line[1]],c=vals[line[2]];if(a===b&&b===c){prize+=a==='T'?25:8;hits.push(...line)}});
 if(!prize&&vals.filter(v=>v==='T').length>=3) prize=5;
 balance+=prize;bal.textContent=fmt(balance);win.textContent=fmt(prize);
 msg.textContent=prize?(prize>=25?'🔥 TIAGUINHO! GRANDE GANHO! 🔥':'🎉 GANHOU '+fmt(prize)+'!'):'';
 [...new Set(hits)].forEach(i=>root.querySelector('.r'+i)?.classList.add('hit'));
 busy=false;
 if(auto && balance>=1) autoTimer=setTimeout(spin,turbo?450:1000);
}
function spin(){
 if(busy||balance<1){if(balance<1){msg.textContent='SEM FICHAS 😂';auto=false}return}
 busy=true;balance-=1;bal.textContent=fmt(balance);win.textContent='R$ 0,00';msg.textContent='';
 const reels=[...root.querySelectorAll('.reel')];
 reels.forEach((r,i)=>{r.classList.add('spin');timers.push(setInterval(()=>{let v=rnd();r.dataset.symbol=v;r.firstChild.src=imgs[v]},55+i*4))});
 setTimeout(finish,turbo?320:850);
}
document.getElementById('spin').addEventListener('click',spin);
document.getElementById('turbo').addEventListener('click',()=>{turbo=!turbo;msg.textContent=turbo?'⚡ TURBO':' ';setTimeout(()=>{if(!busy)msg.textContent=''},600)});
document.getElementById('auto').addEventListener('click',()=>{auto=!auto;msg.textContent=auto?'🔁 AUTO':' ';if(auto&&!busy)spin();else if(!auto){clearTimeout(autoTimer);autoTimer=null}});
makeReels(initial);
})();
</script></body></html>
